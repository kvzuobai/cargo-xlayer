[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
ffi = false
# CargoMiner v2 > 24 KB without via-IR (s40). Only that file uses it: via-IR in test contracts caches block.timestamp across vm.warp.
additional_compiler_profiles = [{ name = "viair", via_ir = true }]
compilation_restrictions = [{ paths = "src/CargoMiner.sol", via_ir = true }]
fs_permissions = []

[rpc_endpoints]
bsc = "https://tapeout.net/rpc"

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 20
